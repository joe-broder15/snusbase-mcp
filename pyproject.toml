[project]
name = "snusbase-client"
version = "0.1.0"
description = "Typed Python client and OpenAPI 3.1 description of the documented Snusbase API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "joe-broder15" }]
keywords = ["snusbase", "openapi", "breach"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.urls]
Documentation = "https://docs.snusbase.com/"
"Terms of Service" = "https://docs.snusbase.com/terms-of-service.html"
"API docs source" = "https://github.com/snusbase/docs.snusbase.com"

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.7",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["snusbase_client"]
