                          seen_czds: "2026-06-20T16:47:39Z"
                          sources: ["czds", "rdap", "dns"]
                        dns:
                          security:
                            signed: false
                          records:
                            - type: A
                              name: example.org
                              ttl: 113
                              values: ["104.20.26.136", "172.66.157.237"]
                            - type: AAAA
                              name: example.org
                              ttl: 129
                              values:
                                - "2606:4700:10::6814:1a88"
                                - "2606:4700:10::ac42:9ded"
                            - type: MX
                              name: example.org
                              ttl: 300
                              values:
                                - priority: 0
                                  server: "."
                            - type: TXT
                              name: example.org
                              ttl: 300
                              values:
                                - _uyh0vgv5ukyofwj3ddwspnni01vmlyy
                                - "v=spf1 -all"
                            - type: A
                              name: www.example.org
                              ttl: 300
                              values: ["104.20.26.136", "172.66.157.237"]
