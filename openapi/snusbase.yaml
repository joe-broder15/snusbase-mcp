                              name: www.example.org
                              ttl: 300
                              values:
                                - "2606:4700:10::6814:1a88"
                                - "2606:4700:10::ac42:9ded"
                      presence.sh:
                        domain: presence.sh
                        tld: sh
                        date:
                          created: "2026-01-09T15:22:13Z"
