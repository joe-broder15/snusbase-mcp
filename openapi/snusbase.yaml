                          sources: ["whois", "dns"]
                        dns:
                          security:
                            signed: false
                          records:
                            - type: A
                              name: presence.sh
                              ttl: 300
                              values: ["104.21.46.130", "172.67.139.8"]
                            - type: AAAA
                              name: presence.sh
                              ttl: 300
                              values:
                                - "2606:4700:3033::6815:2e82"
