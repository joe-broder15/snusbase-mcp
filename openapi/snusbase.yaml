                      - "not8489291real.com: Likely not registered"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    Auth:
      type: apiKey
      in: header
      name: Auth
      description: |
        Activation code. Send it in the `Auth` header. This is not an `Authorization`
        header and not a Bearer token. Codes generated after September 2021 start
        with `sb` followed by 28 random characters.

  headers:
    XRateLimit:
      description: |
        Maximum number of requests allowed in the current window.
        Present on authenticated requests.
      schema:
        type: integer
    XRateLimitRemaining:
      description: |
        Number of requests remaining in the current window.
        Present on authenticated requests.
      schema:
        type: integer
    XRateLimitReset:
      description: |
        Seconds until the current rate limit window resets.
        Present on authenticated requests. The docs describe a duration in seconds,
        not a Unix timestamp.
      schema:
        type: integer

  responses:
    BadRequest:
      description: Invalid input or missing required parameters.
      headers: *rateLimitHeaders
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid, expired, or missing API key.
      headers: *rateLimitHeaders
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      headers: *rateLimitHeaders
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ErrorWithoutRateLimit:
      description: |
        Invalid input or missing required parameters.
        Rate-limit headers are not documented for unauthenticated requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedWithoutRateLimit:
      description: |
        Invalid, expired, or missing API key.
        Rate-limit headers are not documented for unauthenticated requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimitedWithoutRateLimit:
      description: |
        Rate limit exceeded.
        Rate-limit headers are not documented for unauthenticated requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Took:
      type: number
      description: |
        Server-reported elapsed time. Documented examples include 31.714, 18.591,
        2.905, 0.102, 6.4, and 264.706. The docs do not state the unit.

    Size:
      type: integer
      description: |
        Numeric `size` returned with `took`. Search, count, combo, and hash examples
        use it as a match count. The domain WHOIS example uses it as the number of
        resolved records (3 terms, size 2, plus an `errors` entry).

    ErrorResponse:
      type: object
      additionalProperties: true
      required: [errors]
      description: |
        Error body for HTTP 400, 401, and 429. The docs say `errors` messages are
        safe to display to end users. No sample 400/401/429 JSON is published. The
        only published `errors` entry is on a 200 domain-whois response.
      properties:
        errors:
          type: array
          items:
            type: string

    SearchType:
      type: string
      description: Column a `/data/search` or `/data/count` term is matched against.
      enum:
        - email
        - username
        - lastip
        - password
        - hash
        - name
        - _domain

    ComboLookupType:
      type: string
      description: Field a `/tools/combo-lookup` term is matched against.
      enum:
        - username
        - password

    HashLookupType:
      type: string
      description: Field a `/tools/hash-lookup` term is matched against.
      enum:
        - hash
        - password

    SearchGroupBy:
      description: |
        Grouping for search, combo lookup, and hash lookup. Defaults to `"db"`
        (group by database/table). `false` disables grouping. A string groups by
        that column; rows missing it are bucketed under `NO_{GROUP_BY}`.
      default: "db"
      oneOf:
        - type: boolean
        - type: string

    WhoisGroupBy:
      description: |
        Grouping for IP and domain WHOIS. Omitted is not the same as `"db"`: results
        stay keyed by the input. A string groups by that field (or, for domains, a
        dotted path). `false` returns a flat array. Missing values use a `NO_{FIELD}`
        bucket.
      oneOf:
        - type: boolean
        - type: string

    SearchRequest:
      type: object
      additionalProperties: false
      required: [terms, types]
      properties:
        terms:
          type: array
          items:
            type: string
          description: Search terms.
        types:
          type: array
          items:
            $ref: "#/components/schemas/SearchType"
          description: |
            Types of data to search. Each type is applied to every term.
        wildcard:
          type: boolean
          description: |
            Enable wildcard search. `%` is any number of characters (including none)
            and `?` is exactly one character. A wildcard cannot be the first character.
            Escape `%` or `?` with a backslash. Prefer `_domain` for domain searches.
        group_by:
          $ref: "#/components/schemas/SearchGroupBy"
        tables:
          type: array
          items:
            type: string
          description: |
            Limit the search to these tables and return all available columns
            (View More) rather than the default column set.

    CountRequest:
      type: object
      additionalProperties: false
      required: [terms, types]
      description: |
        Same body as search, without `group_by`, plus `include_results`.
      properties:
        terms:
          type: array
          items:
            type: string
          description: Search terms.
        types:
          type: array
          items:
            $ref: "#/components/schemas/SearchType"
          description: Types of data to search. Each type is applied to every term.
        wildcard:
          type: boolean
          description: Enable wildcard search (`true` or `false`).
        tables:
          type: array
          items:
            type: string
          description: Limit the count to specific tables.
        include_results:
          type: boolean
          default: true
          description: |
            Include the per-table `results` count map. Defaults to true.
            Set to false to return only `took` and `size`.

    ComboLookupRequest:
      type: object
      additionalProperties: false
      required: [terms, types]
      properties:
        terms:
          type: array
          items:
            type: string
          description: Search terms (usernames or passwords).
        types:
          type: array
          items:
            $ref: "#/components/schemas/ComboLookupType"
          description: Types of data to search.
        wildcard:
          type: boolean
          description: Enable wildcard search (`true` or `false`).
        group_by:
          $ref: "#/components/schemas/SearchGroupBy"

    HashLookupRequest:
      type: object
      additionalProperties: false
      required: [terms, types]
      properties:
        terms:
          type: array
          items:
            type: string
          description: Hashes or passwords to look up.
        types:
          type: array
          items:
            $ref: "#/components/schemas/HashLookupType"
          description: Types of lookup.
        wildcard:
          type: boolean
          description: Enable wildcard search.
        group_by:
          $ref: "#/components/schemas/SearchGroupBy"

    IpWhoisRequest:
      type: object
      additionalProperties: false
      required: [terms]
      properties:
        terms:
          type: array
          items:
            type: string
          description: IP addresses to look up.
        group_by:
          $ref: "#/components/schemas/WhoisGroupBy"

    DomainWhoisRequest:
      type: object
      additionalProperties: false
      required: [terms]
      properties:
        terms:
          type: array
          maxItems: 100
          items:
            type: string
          description: Domain names to look up (max 100 per request).
        group_by:
          $ref: "#/components/schemas/WhoisGroupBy"

    BreachRecord:
      type: object
      additionalProperties: true
      description: |
        One database row. Columns depend on the table (`GET /data/stats` lists them).
        The properties below appear in the documented search example, the stats column
        sample (`host`, `_domain`), or the search type list (`name`, `password`).
        A row is not guaranteed to contain any of them. Further columns are allowed.
      properties:
        username:
          type: string
        email:
          type: string
        lastip:
          type: string
        password:
          type: string
        hash:
          type: string
        salt:
          type: string
        uid:
          type: string
        created:
          type: string
        updated:
          type: string
        host:
          type: string
        name:
          type: string
        _domain:
          type: string

    ComboRecord:
      type: object
      additionalProperties: true
      description: |
        One combolist row. The documented example has `username` and `password`.
        Other keys are allowed.
      properties:
        username:
          type: string
        password:
          type: string

    HashRecord:
      type: object
      additionalProperties: true
      description: |
        One hash-database row. The documented example has `hash` and `password`.
        Other keys are allowed.
      properties:
        hash:
          type: string
        password:
          type: string

    GroupedBreachResults:
      description: |
        Default (`group_by` of `"db"`) and column grouping: an object whose values
        are arrays of rows, keyed by table or by the group value, including
        `NO_{GROUP_BY}` when a row lacks that column. `group_by: false` disables
        grouping; that payload is not shown in the docs, so a bare array is also
        accepted.
      oneOf:
        - type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/BreachRecord"
        - type: array
          items:
            $ref: "#/components/schemas/BreachRecord"

    GroupedComboResults:
      description: |
        Same grouping shapes as search results. The published example is an object
        keyed by combolist name. A bare array is accepted for `group_by: false`,
        which the docs describe but do not show.
      oneOf:
        - type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ComboRecord"
        - type: array
          items:
            $ref: "#/components/schemas/ComboRecord"

    GroupedHashResults:
      description: |
        Same grouping shapes as search results. The published example is an object
        with a `HASHES` array. A bare array is accepted for `group_by: false`.
      oneOf:
        - type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/HashRecord"
        - type: array
          items:
            $ref: "#/components/schemas/HashRecord"

    CountResults:
      type: object
      additionalProperties:
        type: integer
      description: Map of table name to match count.

    StatsFeatures:
      type: object
      additionalProperties: true
      required: [view_more, combo_lookup]
      properties:
        view_more:
          type: array
          items:
            type: string
          description: Tables that support the View More column set.
        combo_lookup:
          type: array
          items:
            type: string
          description: Tables included in combo lookup.

    StatsResponse:
      type: object
      additionalProperties: true
      required: [rows, tables, features]
      properties:
        rows:
          type: integer
          description: Total rows reported for the main search databases.
        tables:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Map of table name to that table's column names.
        features:
          $ref: "#/components/schemas/StatsFeatures"

    SearchResponse:
      type: object
      additionalProperties: true
      required: [took, size, results]
      properties:
        took:
          $ref: "#/components/schemas/Took"
        size:
          $ref: "#/components/schemas/Size"
        results:
          $ref: "#/components/schemas/GroupedBreachResults"

    CountResponse:
      type: object
      additionalProperties: true
      required: [took, size]
      properties:
        took:
          $ref: "#/components/schemas/Took"
        size:
          $ref: "#/components/schemas/Size"
        results:
          $ref: "#/components/schemas/CountResults"

    ComboLookupResponse:
      type: object
      additionalProperties: true
      required: [took, size, results]
      properties:
        took:
          $ref: "#/components/schemas/Took"
        size:
          $ref: "#/components/schemas/Size"
        results:
          $ref: "#/components/schemas/GroupedComboResults"

    HashLookupResponse:
      type: object
      additionalProperties: true
      required: [took, size, results]
      properties:
        took:
          $ref: "#/components/schemas/Took"
        size:
          $ref: "#/components/schemas/Size"
        results:
          $ref: "#/components/schemas/GroupedHashResults"

    IpWhoisRecord:
      type: object
      additionalProperties: true
      description: |
        One IP WHOIS record, as in the documented example. No field is marked
        required: the docs do not say which keys are always present, and grouped
        buckets can omit the grouped field (`NO_{FIELD}`).
      properties:
        query:
          type: string
        continent:
          type: string
        continentCode:
          type: string
        country:
          type: string
        countryCode:
          type: string
        region:
          type: string
        regionName:
          type: string
        city:
          type: string
        zip:
          type: string
        lat:
          type: number
        lon:
          type: number
        timezone:
          type: string
        isp:
          type: string
        org:
          type: string
        as:
          type: string
        asname:
          type: string
        mobile:
          type: boolean
        proxy:
          type: boolean
        hosting:
          type: boolean

    IpWhoisResults:
      description: |
        Omitted `group_by`: object keyed by IP, values are single records.
        String `group_by`: object of arrays, plus a `NO_{FIELD}` bucket.
        `group_by: false`: a flat array.
      oneOf:
        - type: object
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/IpWhoisRecord"
              - type: array
                items:
                  $ref: "#/components/schemas/IpWhoisRecord"
        - type: array
          items:
            $ref: "#/components/schemas/IpWhoisRecord"

    IpWhoisResponse:
      type: object
      additionalProperties: true
      required: [took, size, results]
      properties:
        took:
          $ref: "#/components/schemas/Took"
        size:
          $ref: "#/components/schemas/Size"
        results:
          $ref: "#/components/schemas/IpWhoisResults"

    DomainDate:
      type: object
      additionalProperties: true
      properties:
        created:
          type: string
          description: Timestamp string as returned by the API. The example is ISO-8601.
        expires:
          type: string
        updated:
          type: string

    DomainRegistrar:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        handle:
          type: string
          description: Registrar handle. The examples are numeric-looking strings.

    DomainMeta:
      type: object
      additionalProperties: true
      description: |
        The sample record uses `sources` (an array). The group_by prose also mentions
        the path `meta.source` (singular), which is allowed as an additional property.
      properties:
        checked:
          type: string
        updated:
          type: string
        seen_czds:
          type: string
        sources:
          type: array
          items:
            type: string

    DnsRecordValue:
      type: object
      additionalProperties: true
      description: MX-style value from the documented example (`priority`, `server`).
      properties:
        priority:
          type: integer
        server:
          type: string

    DnsRecord:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        name:
          type: string
        ttl:
          type: integer
        values:
          type: array
          description: |
            Strings for the documented A, AAAA, and TXT records. Objects for MX
            (`priority`, `server`).
          items:
            oneOf:
              - type: string
              - $ref: "#/components/schemas/DnsRecordValue"

    DomainDnsSecurity:
      type: object
      additionalProperties: true
      properties:
        signed:
          type: boolean

    DomainDns:
      type: object
      additionalProperties: true
      properties:
        security:
          $ref: "#/components/schemas/DomainDnsSecurity"
        records:
          type: array
          items:
            $ref: "#/components/schemas/DnsRecord"

    DomainWhoisRecord:
      type: object
      additionalProperties: true
      description: |
        One domain WHOIS/RDAP record. Fields match the published example and are not
        marked required. `registrant` is included because group_by documents the path
        `registrant.org`; the sample record nests party data under `contact` instead.
      properties:
        domain:
          type: string
        tld:
          type: string
        date:
          $ref: "#/components/schemas/DomainDate"
        nameserver:
          type: array
          items:
            type: string
        registrar:
          $ref: "#/components/schemas/DomainRegistrar"
        status:
          type: array
          items:
            type: string
        contact:
          type: object
          additionalProperties: true
          description: |
            Map of role name to a contact object. The example uses `abuse` (`email`)
            and `owner` (`organization`, `address`).
        registrant:
          type: object
          additionalProperties: true
          description: |
            Loose object for the documented group_by path `registrant.org`.
            Not present in the published response example.
        meta:
          $ref: "#/components/schemas/DomainMeta"
        dns:
          $ref: "#/components/schemas/DomainDns"

    DomainWhoisResults:
      description: |
        Omitted `group_by`: object keyed by the input domain, values are single records.
        String `group_by`: object of arrays, plus a `NO_{FIELD}` bucket.
        `group_by: false`: a flat array.
      oneOf:
        - type: object
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/DomainWhoisRecord"
              - type: array
                items:
                  $ref: "#/components/schemas/DomainWhoisRecord"
        - type: array
          items:
            $ref: "#/components/schemas/DomainWhoisRecord"

    DomainWhoisResponse:
      type: object
      additionalProperties: true
      required: [took, size, results]
      properties:
        took:
          $ref: "#/components/schemas/Took"
        size:
          $ref: "#/components/schemas/Size"
        results:
          $ref: "#/components/schemas/DomainWhoisResults"
        errors:
          type: array
          items:
            type: string
          description: |
            Per-input failures returned with HTTP 200. The documented example is
            "not8489291real.com: Likely not registered". Omit when every input resolves.
