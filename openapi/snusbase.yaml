openapi: 3.1.0
info:
  title: Snusbase API
  version: "0.1.0"
  summary: HTTP API for Snusbase database search, counts, combo and hash lookup, and WHOIS tools.
  description: |
    Unofficial OpenAPI 3.1 description of the public Snusbase API.

    Source of truth (read for this spec, not invented from memory):

    - https://docs.snusbase.com/
    - https://github.com/snusbase/docs.snusbase.com (README blob 535876c681d42db603e3f2fe72e6f13cb4e94542)

    Snusbase does not publish an API version. `info.version` is the version of this document.

    Authentication is the `Auth` header set to an activation code. It is not a Bearer token.
    Codes generated after September 2021 start with `sb` followed by 28 random characters.
    The docs do not specify the alphabet or the shape of older codes.

    `GET /data/stats` does not require authentication. Every other documented endpoint does.

    Documented rate limits (the docs say these can change; prefer the response headers):

    - `POST /data/search`: 2048 requests every 12 hours
    - `POST /data/count`: 2048 requests every 12 hours
    - `POST /tools/combo-lookup`: 4096 requests every 12 hours
    - All other endpoints: 256 requests every 2 minutes

    On authenticated requests the response includes `X-Rate-Limit`, `X-Rate-Limit-Remaining`,
    and `X-Rate-Limit-Reset` (seconds until the current window resets).

    `POST /data/search`, `POST /tools/combo-lookup`, and `POST /tools/hash-lookup` can return
    plaintext credentials. Snusbase says imported rows are largely unsanitized and may contain
    HTML or exploit payloads. Treat every breach field as untrusted.

    Terms of Service: https://docs.snusbase.com/terms-of-service.html
  license:
    name: MIT
    identifier: MIT

externalDocs:
  description: Official Snusbase API documentation
  url: https://docs.snusbase.com/

servers:
  - url: https://api.snusbase.com
    description: Production Snusbase API

# Copied onto authenticated responses. Defined as an OpenAPI extension so the
# YAML anchor has a home; tooling should ignore keys that start with "x-".
x-authenticated-rate-limit-headers: &rateLimitHeaders
  X-Rate-Limit:
    $ref: "#/components/headers/XRateLimit"
  X-Rate-Limit-Remaining:
    $ref: "#/components/headers/XRateLimitRemaining"
  X-Rate-Limit-Reset:
    $ref: "#/components/headers/XRateLimitReset"

security:
  - Auth: []

tags:
  - name: Data
    description: Database statistics, search, and count.
  - name: Tools
    description: Combo lookup, hash lookup, and WHOIS tools.

paths:
  /data/stats:
    get:
      tags: [Data]
      operationId: getDatabaseStats
      summary: Database statistics
      description: |
        Retrieve information about the current databases in the main search engine.
        This endpoint does not require authentication. The documented request example
        sends no `Auth` header.

        Rate limit: 256 requests every 2 minutes (the "all other endpoints" bucket).
        Rate-limit headers are documented for authenticated requests, so they are not
        declared on this operation.
      security: []
      responses:
        "200":
          description: Successful request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
              examples:
                documented:
                  summary: Documented stats example, with the "other tables" comment removed
                  value:
                    rows: 18109138413
                    tables:
                      "0001_STEALERLOGS_NA_121M_MALWARE_2023":
                        - email
                        - username
                        - password
                        - host
                        - _domain
                    features:
                      view_more:
                        - "0005_ZING_VN_51M_ENTERTAINMENT_052015"
                      combo_lookup:
                        - "0001_PEMIBLANC_COMBOLIST_245M_2018"
        "400":
          $ref: "#/components/responses/ErrorWithoutRateLimit"
        "401":
          $ref: "#/components/responses/UnauthorizedWithoutRateLimit"
        "429":
          $ref: "#/components/responses/RateLimitedWithoutRateLimit"

  /data/search:
    post:
      tags: [Data]
      operationId: searchDatabase
      summary: Database search
      description: |
        Search the Snusbase database for leaked information.

        When more than one type is sent, each type is applied to every term. Types are
        not paired with terms by position.

        Wildcard characters, if `wildcard` is true, are `%` (any number of any characters,
        including none) and `?` (exactly one character). A wildcard cannot be the first
        character of a term. Escape a literal `%` or `?` with a backslash. For domain
        searches, use the `_domain` type instead of a leading wildcard.

        `tables` limits the search to those tables and returns all available columns
        rather than the default set. The docs say this is the "View More" feature.

        `group_by` defaults to `"db"`. Set it to false to disable grouping. Set it to a
        column name to group by that column. A row that lacks the column is placed in
        `NO_{GROUP_BY}` (for example `NO_EMAIL` when grouping by `email`). The docs call
        that bucket an object and say the row is appended to it. Every published search
        example is an object whose values are arrays of rows; the ungrouped payload is
        not shown.

        Rate limit: 2048 requests every 12 hours.

        Results can include plaintext secrets and unsanitized HTML or exploit payloads.
      security:
        - Auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            examples:
              email:
                summary: Documented email search
                value:
                  terms: ["example@gmail.com"]
                  types: ["email"]
              multipleTermsAndTypes:
                summary: Each type is applied to every term
                value:
                  terms: ["example1", "example2"]
                  types: ["username", "email", "lastip", "hash", "password", "name"]
              specificTables:
                summary: Documented table filter (View More)
                value:
                  terms: ["example"]
                  types: ["username"]
                  tables: ["0001_STEALERLOGS_NA_106M_MALWARE_2023"]
              groupByColumn:
                summary: Group by a column
                value:
                  terms: ["example"]
                  types: ["username"]
                  group_by: "_domain"
              groupingDisabled:
                summary: group_by false disables grouping
                value:
                  terms: ["example"]
                  types: ["username"]
                  group_by: false
              wildcard:
                summary: Documented wildcard search
                value:
                  terms: ["exa????@%.tld"]
                  types: ["email"]
                  wildcard: true
      responses:
        "200":
          description: Successful request.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              examples:
                documented:
                  summary: Documented search hit, with the "other results" comment removed
                  value:
                    took: 31.714
                    size: 1233
                    results:
                      "2123_BREACHFORUMS_BF_323K_HACKING_012026":
                        - username: avvd
                          email: example@gmail.com
                          lastip: "127.0.0.9"
                          hash: "$argon2i$v=19$m=65536,t=4,p=1$NVphazc1SUg3YUVxNFV3Nw$EmshtvIzcwhG8lnDTsl0XvzCyg7h8k+Qr3tgTQihvZI"
                          salt: Wlwirmmh
                          uid: "331153"
                          created: "1729340505"
                          updated: "1729341708"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /data/count:
    post:
      tags: [Data]
      operationId: countDatabase
      summary: Database count
      description: |
        Count matching rows without returning record contents. By default the body also
        includes a per-table count map in `results`. Set `include_results` to false to
        return only `took` and `size`.

        Parameters match `POST /data/search` except this endpoint has no `group_by`.
        The same wildcard rules are documented on search; this endpoint's parameter
        table only says that `wildcard` enables wildcard search.

        Rate limit: 2048 requests every 12 hours.
      security:
        - Auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountRequest"
            examples:
              email:
                summary: Documented count request
                value:
                  terms: ["example@gmail.com"]
                  types: ["email"]
              totalsOnly:
                summary: include_results false returns took and size only
                value:
                  terms: ["example@gmail.com"]
                  types: ["email"]
                  include_results: false
      responses:
        "200":
          description: Successful request.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
              examples:
                withResults:
                  summary: Documented per-table counts (the docs omit further tables)
                  description: |
                    The published example is truncated ("other results"). The visible
                    per-table counts do not add up to `size`; both are copied as published.
                  value:
                    took: 18.591
                    size: 1245
                    results:
                      "0001_STEALERLOGS_NA_121M_MALWARE_2023": 51
                      "0002_BIT_LY_9316K_SOCIAL_052014": 1
                      "0005_ZING_VN_51M_ENTERTAINMENT_052015": 4
                      "0012_IMGUR_COM_1753K_SOCIAL_092013": 1
                      "0025_BITCOINTALK_ORG_499K_CRYPTO_2015": 1
                      "0065_ICRAFTS_SU_292K_MINECRAFT_2015": 1
                      "0066_IDRESSUP_COM_2M_GAMING_2016": 1
                      "0070_DAILYMOTION_COM_87M_ENTERTAINMENT_2017": 1
                      "0071_JUSTDATE_COM_24M_DATING_2014": 1
                      "0077_WEHEARTIT_COM_9M_SOCIAL_112013": 1
                      "0079_HEROESOFNEWERTH_COM_9M_GAMING_2012": 1
                      "0115_ZOMATO_COM_17M_DATING_052017": 1
                      "0159_BENDERCRAFT_RU_171K_MINECRAFT_052017": 1
                      "0195_DESTERIA_COM_26K_MINECRAFT_2017": 1
                      "0201_DLH_NET_3M_GAMING_2016": 1
                withoutResults:
                  summary: include_results false
                  value:
                    took: 18.591
                    size: 1245
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tools/combo-lookup:
    post:
      tags: [Tools]
      operationId: comboLookup
      summary: Combo lookup
      description: |
        Search the combolist database for username/password combinations from large
        credential dumps.

        `types` is `username` and/or `password`. `group_by` defaults to `"db"`; set it
        to false to disable grouping. The docs do not restate the `%` / `?` wildcard
        syntax here; they only say `wildcard` enables wildcard search.

        Rate limit: 4096 requests every 12 hours.

        Results are plaintext credentials. Treat every field as untrusted.
      security:
        - Auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComboLookupRequest"
            examples:
              username:
                summary: Documented combo lookup
                value:
                  terms: ["example@gmail.com"]
                  types: ["username"]
      responses:
        "200":
          description: Successful request.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComboLookupResponse"
              examples:
                documented:
                  summary: Documented combolist hit
                  value:
                    took: 2.905
                    size: 1194
                    results:
                      COLLECTION1_1212M_COMBOLIST_2019:
                        - username: example@gmail.com
                          password: "0981122847"
                        - username: example@gmail.com
                          password: "123456"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tools/hash-lookup:
    post:
      tags: [Tools]
      operationId: hashLookup
      summary: Hash lookup
      description: |
        Search for a plaintext password given a hash, or the reverse, in the cracked
        password hash database.

        `types` is `hash` and/or `password`. `group_by` defaults to `"db"`; set it to
        false to disable grouping. The docs do not restate wildcard syntax here.

        Rate limit: 256 requests every 2 minutes (the "all other endpoints" bucket).

        Results can include plaintext passwords. Treat every field as untrusted.
      security:
        - Auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HashLookupRequest"
            examples:
              hash:
                summary: Documented hash lookup
                value:
                  terms: ["482c811da5d5b4bc6d497ffa98491e38"]
                  types: ["hash"]
      responses:
        "200":
          description: Successful request.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashLookupResponse"
              examples:
                documented:
                  summary: Documented hash hit
                  value:
                    took: 0.102
                    size: 1
                    results:
                      HASHES:
                        - hash: "482c811da5d5b4bc6d497ffa98491e38"
                          password: password123
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tools/ip-whois:
    post:
      tags: [Tools]
      operationId: ipWhoisLookup
      summary: IP WHOIS lookup
      description: |
        Retrieve WHOIS information for IP addresses.

        When `group_by` is omitted, `results` is an object keyed by the IP and each
        value is one record. Set `group_by` to a field name (for example `country`,
        `isp`, or `as`) to get arrays of records grouped by that value, with a
        `NO_{FIELD}` bucket for records missing it. Set `group_by` to false for a flat
        array. Unlike search, the docs do not say the default is `"db"`.

        Rate limit: 256 requests every 2 minutes.
      security:
        - Auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpWhoisRequest"
            examples:
              documented:
                summary: Documented IP WHOIS request
                value:
                  terms: ["12.34.56.78"]
      responses:
        "200":
          description: Successful request.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpWhoisResponse"
              examples:
                documented:
                  summary: Documented IP WHOIS record, keyed by the queried IP
                  value:
                    took: 6.4
                    size: 1
                    results:
                      "12.34.56.78":
                        query: "12.34.56.78"
                        continent: North America
                        continentCode: NA
                        country: United States
                        countryCode: US
                        region: OH
                        regionName: Ohio
                        city: Columbus
                        zip: "43215"
                        lat: 39.9612
                        lon: -82.9988
                        timezone: America/New_York
                        isp: "AT&T Enterprises, LLC"
                        org: "AT&T Enterprises, LLC"
                        as: "AS7018 AT&T Enterprises, LLC"
                        asname: ATT-INTERNET4
                        mobile: false
                        proxy: false
                        hosting: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tools/domain-whois:
    post:
      tags: [Tools]
      operationId: domainWhoisLookup
      summary: Domain WHOIS lookup
      description: |
        Retrieve WHOIS/RDAP information for domain names. Works with gTLDs, ccTLDs,
        and IDN domains.

        `terms` allows at most 100 domains per request. When `group_by` is omitted,
        `results` is an object keyed by the input and each value is one record. Set
        `group_by` to a field path (for example `tld`, `registrar.name`,
        `registrant.org`, or `meta.source`) to get arrays grouped by that value, with
        a `NO_{FIELD}` bucket for records missing it. Dotted paths walk into nested
        objects. Set `group_by` to false for a flat array. The docs do not say the
        default is `"db"`.

        A 200 body may include `errors` for inputs that did not resolve. The published
        example is `not8489291real.com: Likely not registered`.

        The group_by prose mentions `registrant.org` and `meta.source`. The published
        record uses `contact` (not `registrant`) and `meta.sources` (plural).

        Rate limit: 256 requests every 2 minutes.
      security:
        - Auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainWhoisRequest"
            examples:
              documented:
                summary: Documented domain WHOIS request, including one unregistered name
                value:
                  terms: ["example.org", "presence.sh", "not8489291real.com"]
      responses:
        "200":
          description: |
            Successful request. Individual inputs may still be reported in `errors`.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainWhoisResponse"
              examples:
                documented:
                  summary: Documented domain WHOIS response
                  value:
                    took: 264.706
                    size: 2
                    results:
                      example.org:
                        domain: example.org
                        tld: org
                        date:
                          created: "1995-08-31T04:00:00Z"
                          expires: "2026-08-30T04:00:00Z"
                          updated: "2026-01-16T15:54:51.136Z"
                        nameserver:
                          - katelyn.ns.cloudflare.com
                          - mitch.ns.cloudflare.com
                        registrar:
                          name: icann
                          handle: "376"
                        status:
                          - serverdeleteprohibited
                          - servertransferprohibited
